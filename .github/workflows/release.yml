name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the manifest
        id: manifest
        run: |
          version=$(python3 -c 'import json; print(json.load(open("src/manifest.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.manifest.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${{ steps.manifest.outputs.version }}" >&2
            exit 1
          fi

      - name: Build the XPI
        run: |
          mkdir -p dist
          (cd src && zip -r -X "../dist/persian-compatibility-for-thunderbird-${{ steps.manifest.outputs.version }}.xpi" . -x '.*')
          unzip -l dist/*.xpi | tail -n 3

      - name: Upload the XPI as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: dist/*.xpi

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.xpi \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
